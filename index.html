<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111214"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Office">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Agent Office</title>
<style>html,body{margin:0;height:100%;background:#111214;color:#e9e9ea;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.c{width:100%;max-width:340px;background:#1d1e22;border:1px solid #2f3035;border-radius:16px;padding:26px 22px;box-shadow:0 20px 60px #000c;text-align:center}
.c img{width:64px;height:64px;image-rendering:pixelated;border-radius:14px}.c h1{font-size:19px;margin:12px 0 4px}.c p{color:#8a8b90;margin:0 0 16px;font-size:13px}
input[type=password]{width:100%;box-sizing:border-box;background:#26272b;border:1px solid #3a3b40;color:#fff;border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;outline:none}input:focus{border-color:#d9a33a}
label{display:flex;gap:8px;align-items:center;justify-content:center;color:#b4b5ba;font-size:13px;margin:12px 0}
button{width:100%;background:#d9a33a;color:#111;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}
.e{color:#ff8a8a;font-size:13px;min-height:18px;margin-top:10px}.f{color:#5d5e63;font-size:11px;margin-top:14px}</style></head><body>
<div class="w"><form class="c" id="f"><img src="icon-192.png" alt=""><h1>🔒 Agent Office</h1><p>Private. Enter your passcode to unlock.</p>
<input type="password" id="pw" placeholder="Passcode" autocomplete="current-password" autofocus><label><input type="checkbox" id="rm"> Remember on this device</label>
<button id="go">Unlock</button><div class="e" id="er"></div><div class="f">End-to-end encrypted (AES-GCM, PBKDF2-SHA256 600k)</div></form></div>
<script>
(()=>{const SALT="xMgTwE/tnsURtFRb1lr98Q==",ITER=600000;const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function openApp(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const o=await (await fetch('app.enc?t='+Date.now(),{cache:'no-store'})).json();
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(o.iv)},k,b64(o.ct));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
(async()=>{const k=sessionStorage.getItem('ao.k')||localStorage.getItem('ao.k');if(k){try{sessionStorage.setItem('ao.k',k);await openApp(b64(k));return}catch(e){sessionStorage.removeItem('ao.k');localStorage.removeItem('ao.k')}}})();
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const b=document.getElementById('go'),er=document.getElementById('er');b.disabled=true;b.textContent='Unlocking…';er.textContent='';
 try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  const raw=await crypto.subtle.exportKey('raw',key);const k=e64(raw);sessionStorage.setItem('ao.k',k);if(document.getElementById('rm').checked)localStorage.setItem('ao.k',k);try{await openApp(raw)}catch(x){sessionStorage.removeItem('ao.k');localStorage.removeItem('ao.k');throw x}}
 catch(e){er.textContent='Wrong passcode. Try again.';b.disabled=false;b.textContent='Unlock'}};
})();
</script></body></html>
